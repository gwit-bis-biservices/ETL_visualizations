<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IDMC Lineage — Impact Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap');
:root{--bg:#0d1117;--bg2:#161b24;--bg3:#1e2637;--border:#252d40;
  --root:#2dd4aa;--stage:#f5a623;--leaf:#4a9eff;--failed:#ff4d4d;
  --text:#cdd5e0;--dim:#4a5568;--hi:#f0f4ff;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;overflow:hidden;display:flex;flex-direction:column;}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--hi);}
.logo em{color:var(--root);font-style:normal;}
#stats{margin-left:auto;display:flex;gap:20px;}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--hi);line-height:1;}
.stat .l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
.toolbar{display:flex;align-items:center;gap:8px;padding:7px 20px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
#search{background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--hi);
  font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px;width:300px;outline:none;}
#search:focus{border-color:var(--root);}
.search-wrap{position:relative;}
#suggestions{position:absolute;top:100%;left:0;width:300px;background:var(--bg2);
  border:1px solid var(--border);border-radius:4px;z-index:100;max-height:220px;overflow-y:auto;display:none;}
.sug-item{padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:10px;cursor:pointer;border-bottom:1px solid var(--border);}
.sug-item:hover{background:var(--bg3);color:var(--hi);}
.sug-tier{font-size:8px;margin-left:6px;padding:1px 5px;border-radius:2px;}
.tbtn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);cursor:pointer;
  padding:4px 10px;border-radius:3px;border:1px solid transparent;transition:all .15s;display:flex;align-items:center;gap:4px;}
.tbtn:hover,.tbtn.on{background:var(--bg3);color:var(--text);border-color:var(--border);}
.tsep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
#mode-label{font-size:10px;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
.main{flex:1;display:flex;overflow:hidden;position:relative;}
#cv{flex:1;background:var(--bg);cursor:grab;}
#cv:active{cursor:grabbing;}
#loading{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;}
#loading p{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin-top:14px;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--root);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.panel{width:300px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s;flex-shrink:0;}
.panel.closed{width:0;}
.ph{padding:11px 14px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.ptitle{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--hi);text-transform:uppercase;letter-spacing:.08em;}
.pclose{color:var(--dim);cursor:pointer;font-size:17px;line-height:1;}
.pclose:hover{color:var(--hi);}
.pb{flex:1;overflow-y:auto;padding:12px 14px;}
.pb::-webkit-scrollbar{width:3px;}
.pb::-webkit-scrollbar-thumb{background:var(--border);}
.psec{margin-bottom:14px;}
.psec-t{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
.pname{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--hi);word-break:break-all;line-height:1.4;margin-bottom:5px;}
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:3px;margin-bottom:8px;margin-right:4px;}
.b-root{background:rgba(45,212,170,.15);color:var(--root);}
.b-stage{background:rgba(245,166,35,.15);color:var(--stage);}
.b-leaf{background:rgba(74,158,255,.15);color:var(--leaf);}
.b-failed{background:rgba(255,77,77,.15);color:var(--failed);}
.pill{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:2px 6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--text);margin:2px 2px 2px 0;}
.dlist{list-style:none;}
.ditem{padding:4px 8px;margin-bottom:3px;background:var(--bg3);border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text);border-left:2px solid var(--border);cursor:pointer;transition:border-color .12s;}
.ditem:hover{border-left-color:var(--stage);color:var(--hi);}
.dvia{font-size:8px;color:var(--dim);margin-top:2px;}
.warn-item{border-left-color:var(--failed)!important;}
.zbtns{position:absolute;bottom:20px;left:16px;display:flex;flex-direction:column;gap:3px;z-index:10;}
.zbtn{width:30px;height:30px;background:var(--bg2);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.zbtn:hover{background:var(--bg3);color:var(--hi);}
.tip{position:fixed;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text);pointer-events:none;z-index:999;opacity:0;transition:opacity .1s;max-width:280px;box-shadow:0 4px 20px rgba(0,0,0,.6);}
.tip.on{opacity:1;}
.tipname{font-weight:600;color:var(--hi);margin-bottom:4px;}
.tiprow{color:var(--dim);line-height:1.7;}
.tiprow span{color:var(--text);}
.schema-group{margin-bottom:4px;border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.schema-hdr{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;
  background:var(--bg3);cursor:pointer;user-select:none;transition:background .12s;}
.schema-hdr:hover{background:#1a2236;}
.schema-hdr-l{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--hi);}
.schema-cnt{font-size:9px;font-family:'IBM Plex Mono',monospace;color:var(--failed);background:rgba(255,77,77,.12);padding:1px 6px;border-radius:10px;}
.schema-arrow{font-size:10px;color:var(--dim);transition:transform .15s;}
.schema-arrow.open{transform:rotate(90deg);}
.schema-body{display:none;border-top:1px solid var(--border);}
.schema-body.open{display:block;}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">IDMC <em>·</em> GW_Data_Warehouse</div>
    <div style="color:var(--dim);font-size:11px;font-family:'IBM Plex Mono',monospace;">Full Lineage — Impact Analyzer</div>
  </div>
  <div id="stats">
    <div class="stat"><div class="v" id="s-tasks">—</div><div class="l">Tasks</div></div>
    <div class="stat"><div class="v" id="s-edges">—</div><div class="l">Edges</div></div>
    <div class="stat"><div class="v" id="s-roots" style="color:var(--root)">—</div><div class="l">Roots</div></div>
    <div class="stat"><div class="v" id="s-leaves" style="color:var(--leaf)">—</div><div class="l">Leaves</div></div>
  </div>
</header>
<div class="toolbar">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="Search task to analyze impact..." autocomplete="off">
    <div id="suggestions"></div>
  </div>
  <div class="tbtn on" id="btn-impact" onclick="setMode('impact',this)">Impact View</div>
  <div class="tbtn" id="btn-full" onclick="setMode('full',this)">Full Graph</div>
  <div class="tsep"></div>
  <div class="tbtn" onclick="filterTier('root')"><span class="dot" style="background:var(--root)"></span>Roots</div>
  <div class="tbtn" onclick="filterTier('stage')"><span class="dot" style="background:var(--stage)"></span>Stages</div>
  <div class="tbtn" onclick="filterTier('leaf')"><span class="dot" style="background:var(--leaf)"></span>Leaves</div>
  <div class="tbtn" onclick="filterTier(null)"><span class="dot" style="background:var(--border)"></span>All</div>
  <div class="tsep"></div>
  <div class="tbtn" onclick="filterEnv('BNRPRD')" id="btn-bnr"><span class="dot" style="background:#a78bfa"></span>BNRPRD</div>
  <div class="tbtn" onclick="filterEnv('EASPRD')" id="btn-eas"><span class="dot" style="background:#f472b6"></span>EASPRD</div>
  <div class="tbtn" onclick="filterEnv('Warehouse')" id="btn-wh"><span class="dot" style="background:#60a5fa"></span>Warehouse</div>
  <div class="tbtn" onclick="filterEnv(null)" id="btn-all-env"><span class="dot" style="background:var(--border)"></span>All Envs</div>
  <div class="tsep"></div>
  <span id="mode-label">Load lineage_graph.json to begin</span>
</div>
<div class="main">
  <div id="loading">
    <div class="spinner"></div>
    <p id="load-msg">Looking for lineage_graph.json ...</p>
  </div>
  <svg id="cv"></svg>
  <div class="panel closed" id="panel">
    <div class="ph"><div class="ptitle">Task Details</div><div class="pclose" onclick="closePanel()">×</div></div>
    <div class="pb" id="pbody"></div>
  </div>
  <div class="zbtns">
    <button class="zbtn" onclick="zIn()">+</button>
    <button class="zbtn" onclick="zOut()">−</button>
    <button class="zbtn" onclick="zFit()" style="font-size:11px">⊙</button>
  </div>
</div>
<div class="tip" id="tip"></div>

function initGraph(data) {
  const rawNodes = data.nodes||[];
  const rawLinks = data.links||[];

  ALL_NODES = rawNodes.map(n=>{
    // Derive environment from project field (set by parse_and_merge)
    let env = 'Warehouse';
    const proj = (n.project||'').toUpperCase();
    if(proj.includes('BNRPRD')) env='BNRPRD';
    else if(proj.includes('EASPRD')) env='EASPRD';
    // Fallback to path/id heuristic for older data
    else {
      const rtp = (n.raw_target_paths||[])[0]||'';
      if(rtp.toUpperCase().includes('BNRPRD')||n.id.toUpperCase().includes('BNRPRD')) env='BNRPRD';
      else if(rtp.toUpperCase().includes('EASPRD')||n.id.toUpperCase().includes('EASPRD')) env='EASPRD';
    }
    return {
      id:n.id, tier:n.tier||'unknown', depth:n.depth||0,
      mapping:n.mapping_name||'', schema:n.schema||'', env,
      targets:n.target_tables||[], sources:n.source_tables||[],
      lookupMap:n.lookup_table_map||{},
      last_status:n.last_status||'UNKNOWN', failure_rate:n.failure_rate_30d||0,
    };
  });

  // Normalise edge source/target to string ids
  ALL_EDGES = rawLinks.map(l=>({
    source:   typeof l.source==='object'?l.source.id:l.source,
    target:   typeof l.target==='object'?l.target.id:l.target,
    via:      l.via_tables||[],
    via_type: l.via_type||'source',
  }));

  NODE_MAP={};
  ALL_NODES.forEach(n=>NODE_MAP[n.id]=n);

  const roots  = ALL_NODES.filter(n=>n.tier==='root').length;
  const leaves = ALL_NODES.filter(n=>n.tier==='leaf').length;
  document.getElementById('s-tasks').textContent  = ALL_NODES.length;
  document.getElementById('s-edges').textContent  = ALL_EDGES.length;
  document.getElementById('s-roots').textContent  = roots;
  document.getElementById('s-leaves').textContent = leaves;
  document.getElementById('loading').style.display='none';
  document.getElementById('mode-label').textContent='Search for a task to analyze its impact';

  initSVG();
  initSearch();
}

// ── SVG ───────────────────────────────────────────────────────────────────
function initSVG(){
  svgEl=d3.select('#cv');
  const defs=svgEl.append('defs');
  [['arr','#334466'],['arr-hi','#5588cc'],['arr-fail','#ff4d4d']].forEach(([id,col])=>{
    defs.append('marker').attr('id',id).attr('viewBox','0 0 10 10')
      .attr('refX',18).attr('refY',5).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
      .append('path').attr('d','M0,1 L10,5 L0,9 Z').attr('fill',col);
  });
  G=svgEl.append('g');
  zoom=d3.zoom().scaleExtent([.04,4]).on('zoom',e=>G.attr('transform',e.transform));
  svgEl.call(zoom);
  svgEl.on('click',e=>{if(e.target===document.getElementById('cv'))clearSel();});
}

// ── BFS helpers ───────────────────────────────────────────────────────────
function bfsDownstream(id){
  const result=[]; const vis=new Set([id]); const q=[{node:id,depth:0}];
  while(q.length){
    const {node:cur,depth}=q.shift();
    ALL_EDGES.forEach(e=>{
      if(e.source===cur&&!vis.has(e.target)){
        vis.add(e.target);
        result.push({node:e.target,depth:depth+1,edge:e});
        q.push({node:e.target,depth:depth+1});
      }
    });
  }
  return result.sort((a,b)=>a.depth-b.depth);
}

function downstream(id){
  const vis=new Set([id]); const q=[id];
  while(q.length){
    const cur=q.shift();
    ALL_EDGES.forEach(e=>{if(e.source===cur&&!vis.has(e.target)){vis.add(e.target);q.push(e.target);}});
  }
  return vis;
}
function upstream(id){
  const vis=new Set([id]); const q=[id];
  while(q.length){
    const cur=q.shift();
    ALL_EDGES.forEach(e=>{if(e.target===cur&&!vis.has(e.source)){vis.add(e.source);q.push(e.source);}});
  }
  return vis;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(focusId){
  if(!svgEl)return;
  G.selectAll('*').remove();
  if(sim){sim.stop();sim=null;}

  let nodes, edges, visSet;

  if(MODE==='impact'&&focusId){
    visSet = downstream(focusId);
    const allDown=ALL_NODES.filter(n=>visSet.has(n.id)&&n.id!==focusId);
    const count=allDown.length;
    document.getElementById('mode-label').textContent=
      `Impact: ${count} downstream task${count!==1?'s':''} at risk`;

    const groups={};
    allDown.forEach(n=>{
      const key=n.env!=='Warehouse'?n.env+'·'+(n.schema||'?'):(n.schema||'?');
      if(!groups[key]) groups[key]={key,env:n.env,schema:n.schema||'?',members:[]};
      groups[key].members.push(n);
    });

    nodes=[]; edges=[];
    const focusNode=ALL_NODES.find(n=>n.id===focusId);
    if(focusNode) nodes.push({...focusNode});

    Object.values(groups).forEach(g=>{
      if(EXPANDED_CLUSTERS.has(g.key)) g.members.forEach(n=>nodes.push({...n}));
      else nodes.push({id:'__cluster__'+g.key,isCluster:true,clusterKey:g.key,
        count:g.members.length,env:g.env,schema:g.schema,
        memberIds:new Set(g.members.map(m=>m.id)),tier:'stage',depth:0});
    });

    const nodeIds=new Set(nodes.map(n=>n.id));
    const taskToCluster={};
    nodes.filter(n=>n.isCluster).forEach(c=>{c.memberIds.forEach(mid=>taskToCluster[mid]=c.id);});

    const edgeKeys=new Set();
    ALL_EDGES.forEach(e=>{
      if(!visSet.has(e.source)||!visSet.has(e.target)) return;
      const src=nodeIds.has(e.source)?e.source:(taskToCluster[e.source]||null);
      const tgt=nodeIds.has(e.target)?e.target:(taskToCluster[e.target]||null);
      if(!src||!tgt||src===tgt) return;
      const k=src+'->'+tgt;
      if(!edgeKeys.has(k)){edgeKeys.add(k);edges.push({source:src,target:tgt,via:e.via||[],via_type:e.via_type||'source'});}
    });

    visSet=new Set(nodes.map(n=>n.id));
  } else if(MODE==='full'){
    let ns=ALL_NODES; let es=ALL_EDGES;
    if(FILTER_TIER||FILTER_ENV){
      const fset=new Set(ALL_NODES.filter(n=>
        (!FILTER_TIER||n.tier===FILTER_TIER)&&(!FILTER_ENV||n.env===FILTER_ENV)
      ).map(n=>n.id));
      ns=ALL_NODES.filter(n=>fset.has(n.id));
      const nset=new Set(ns.map(n=>n.id));
      es=ALL_EDGES.filter(e=>nset.has(e.source)&&nset.has(e.target));
    }
    nodes=ns.map(n=>({...n}));
    edges=es.map(e=>({...e}));
    visSet=new Set(nodes.map(n=>n.id));
    document.getElementById('mode-label').textContent=
      `Full graph — ${nodes.length} tasks, ${edges.length} edges`;
  } else {
    document.getElementById('mode-label').textContent='Search for a task to analyze its impact';
    return;
  }

  const w=document.getElementById('cv').clientWidth;
  const h=document.getElementById('cv').clientHeight;

  // Edges
  const linkSel=G.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',e=>{
      if(!focusId) return '#1e2d45';
      if(e.source===focusId) return '#ff4d4d';
      return '#2a3d5a';
    })
    .attr('stroke-width',e=>e.source===focusId?2.2:1)
    .attr('stroke-opacity',e=>focusId?(e.source===focusId?1:.5):.25)
    .attr('marker-end',e=>e.source===focusId?'url(#arr-fail)':'url(#arr)');

  // Nodes
  const nodeSel=G.append('g').selectAll('g.nd').data(nodes).join('g')
    .attr('class','nd').style('cursor','pointer')
    .on('click',(ev,d)=>{
      ev.stopPropagation();
      if(d.isCluster){
        if(EXPANDED_CLUSTERS.has(d.clusterKey)) EXPANDED_CLUSTERS.delete(d.clusterKey);
        else EXPANDED_CLUSTERS.add(d.clusterKey);
        render(SEL);
      } else { selectNode(d.id); }
    })
    .on('mouseenter',(ev,d)=>showTip(ev,d))
    .on('mouseleave',hideTip)
    .call(d3.drag()
      .on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag', (ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
      .on('end',  (ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;})
    );

  nodeSel.append('circle')
    .attr('r',d=>d.id===focusId?11:d.isCluster?20+Math.min(d.count,30):d.tier==='leaf'?7:5)
    .attr('fill',d=>{
      if(d.id===focusId) return 'rgba(255,77,77,.2)';
      if(d.isCluster) return d.env!=='Warehouse'?envColor(d.env)+'18':'rgba(74,158,255,.1)';
      return TB[d.tier]||TB.unknown;
    })
    .attr('stroke',d=>{
      if(d.id===focusId) return '#ff4d4d';
      if(d.isCluster) return d.env!=='Warehouse'?envColor(d.env):'#4a9eff';
      return d.env!=='Warehouse'?envColor(d.env):TC[d.tier]||TC.unknown;
    })
    .attr('stroke-width',d=>d.id===focusId?2:d.isCluster?1.5:d.env!=='Warehouse'?1.5:1)
    .attr('stroke-dasharray',d=>d.isCluster?'6,3':d.env!=='Warehouse'?'4,2':'none')
    .attr('opacity',1);

  // Name label
  nodeSel.append('text')
    .attr('dy',d=>d.isCluster?5:(d.id===focusId?11:5)+10)
    .attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono,monospace')
    .attr('font-size',d=>d.isCluster?10:d.id===focusId?9:7)
    .attr('font-weight',d=>d.isCluster?600:'normal')
    .attr('fill',d=>{
      if(d.id===focusId) return '#ff6666';
      if(d.isCluster) return d.env!=='Warehouse'?envColor(d.env):'#4a9eff';
      return TC[d.tier]||TC.unknown;
    })
    .attr('pointer-events','none')
    .text(d=>{
      if(d.isCluster) return d.schema;
      const n=d.id;
      const maxLen=d.tier==='leaf'?13:16;
      return n.length>maxLen?n.slice(0,maxLen-1)+'…':n;
    });

  // Target table label — shown below leaf nodes only
  nodeSel.filter(d=>!d.isCluster&&d.tier==='leaf'&&d.targets&&d.targets.length>0).append('text')
    .attr('dy',d=>(d.id===focusId?11:5)+28)
    .attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono,monospace')
    .attr('font-size',6)
    .attr('font-weight',600)
    .attr('fill',d=>d.env!=='Warehouse'?envColor(d.env)+'cc':'rgba(45,212,170,.8)')
    .attr('pointer-events','none')
    .text(d=>{
      const t=d.targets[0];
      return t.length>14?t.slice(0,13)+'…':t;
    });

  // Count label for clusters
  nodeSel.filter(d=>d.isCluster).append('text')
    .attr('dy',18).attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono,monospace').attr('font-size',9)
    .attr('fill',d=>d.env!=='Warehouse'?envColor(d.env)+'bb':'#4a9effbb')
    .attr('pointer-events','none')
    .text(d=>`${d.count} tasks ›`);

  // Schema label for regular nodes only
  nodeSel.filter(d=>!d.isCluster).append('text')
    .attr('dy',d=>(d.id===focusId?11:5)+19)
    .attr('text-anchor','middle')
    .attr('font-family','IBM Plex Mono,monospace').attr('font-size',7)
    .attr('fill',d=>d.env!=='Warehouse'?envColor(d.env)+'99':'rgba(200,215,240,.35)')
    .attr('pointer-events','none')
    .text(d=>d.env!=='Warehouse'?`[${d.env}·${d.schema||'?'}]`:d.schema?`[${d.schema}]`:'');

  sim=d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>{
      const sl=typeof d.source==='object'?d.source.id:d.source;
      return sl===focusId?80:50;
    }).strength(.7))
    .force('charge',d3.forceManyBody().strength(nodes.length>200?-30:-70))
    .force('center',d3.forceCenter(w/2,h/2))
    .force('collision',d3.forceCollide(d=>d.isCluster?28+Math.min(d.count||0,30):14))
    .on('tick',()=>{
      linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
             .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
    });

  if(focusId){
    const fn=nodes.find(n=>n.id===focusId);
    if(fn){fn.fx=w/2;fn.fy=h/2;}
  }
}

// ── SELECTION ─────────────────────────────────────────────────────────────
function selectNode(id){
  if(id!==SEL) EXPANDED_CLUSTERS.clear();
  SEL=id;
  render(id);
  openPanel(id);
}

function clearSel(){
  SEL=null;
  closePanel();
  if(MODE==='impact'){
    G.selectAll('*').remove();
    if(sim){sim.stop();sim=null;}
    document.getElementById('mode-label').textContent='Search for a task to analyze its impact';
  }
}

function setMode(mode,el){
  MODE=mode;
  document.getElementById('btn-impact').classList.toggle('on',mode==='impact');
  document.getElementById('btn-full').classList.toggle('on',mode==='full');
  render(SEL);
}

function filterTier(tier){FILTER_TIER=tier;if(MODE==='full')render(SEL);}
function filterEnv(env){
  FILTER_ENV=env;
  ['btn-bnr','btn-eas','btn-wh','btn-all-env'].forEach(id=>document.getElementById(id).classList.remove('on'));
  const map={'BNRPRD':'btn-bnr','EASPRD':'btn-eas','Warehouse':'btn-wh',null:'btn-all-env'};
  if(map[env]) document.getElementById(map[env]).classList.add('on');
  if(MODE==='full') render(SEL);
  else {
    // In impact mode — filter the search suggestions
    document.getElementById('search').dispatchEvent(new Event('input'));
  }
}
function envColor(env){
  if(env==='BNRPRD') return '#a78bfa';
  if(env==='EASPRD') return '#f472b6';
  return '#60a5fa';
}

// ── PANEL ──────────────────────────────────────────────────────────────────
function openPanel(id){
  const n=NODE_MAP[id]; if(!n)return;
  document.getElementById('panel').classList.remove('closed');

  const dn=ALL_EDGES.filter(e=>e.source===id);
  const up=ALL_EDGES.filter(e=>e.target===id);
  const ds=downstream(id);
  const dsCount=ds.size-1;

  const bc=n.tier==='root'?'b-root':n.tier==='stage'?'b-stage':'b-leaf';

  const _focusId = id; // capture for schema group builder below
  document.getElementById('pbody').innerHTML=`
    <div class="psec">
      <div class="pname">${id}</div>
      <span class="badge ${bc}">${n.tier} · depth ${n.depth}</span>
      ${n.env!=='Warehouse'?`<span class="badge" style="background:rgba(167,139,250,.15);color:${n.env==='BNRPRD'?'#a78bfa':'#f472b6'}">${n.env}</span>`:''}
      ${n.last_status==='FAILED'?'<span class="badge b-failed">FAILED</span>':''}
    </div>
    <div class="psec">
      <div class="psec-t">Mapping</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text)">${n.mapping||'—'}</div>
    </div>
    ${n.targets?.length?`<div class="psec"><div class="psec-t">Writes to</div><div>${n.targets.map(t=>`<span class="pill">${t}</span>`).join('')}</div></div>`:''}
    ${Object.keys(n.lookupMap||{}).length?`<div class="psec"><div class="psec-t">Lookup tables used</div><div>
      ${Object.entries(n.lookupMap).map(([k,v])=>`<span class="pill" title="${k}">⤷ ${v}</span>`).join('')}
    </div></div>`:''}
    ${dsCount>0?`
    <div class="psec">
      <div class="psec-t" style="color:var(--failed)">⚠ If this fails — ${dsCount} task${dsCount!==1?'s':''} at risk</div>
      <div id="schema-groups-${id.replace(/[^a-z0-9]/gi,'_')}" style="max-height:400px;overflow-y:auto;padding-right:2px;">
      </div>
    </div>`:`<div class="psec"><div style="font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--leaf)">◆ Leaf — no downstream dependencies</div></div>`}
    ${up.length?`
    <div class="psec">
      <div class="psec-t">Fed by (${up.length} upstream)</div>
      <ul class="dlist" style="max-height:200px;overflow-y:auto;padding-right:2px;">
        ${up.map(e=>`<li class="ditem" onclick="selectNode('${e.source}')">
          ${e.source}
          <div class="dvia">via ${e.via.slice(0,2).join(', ')}</div>
        </li>`).join('')}
      </ul>
    </div>`:''}
  `;
  buildSchemaGroups(id);
}

function buildSchemaGroups(focusId){
  const container = document.getElementById('schema-groups-'+focusId.replace(/[^a-z0-9]/gi,'_'));
  if(!container) return;
  const all = bfsDownstream(focusId);
  const groups = {};
  all.forEach(({node:t,depth:dep,edge:e})=>{
    const nd = NODE_MAP[t];
    const env = nd ? nd.env : 'Warehouse';
    const sch = nd ? (nd.schema||'?') : '?';
    const grpKey = env!=='Warehouse' ? env+' · '+sch : sch;
    if(!groups[grpKey]) groups[grpKey]={tasks:[],env};
    groups[grpKey].tasks.push({t,dep,e});
  });
  const html = Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0])).map(([schema,g],gi)=>{
    const dotColor = g.env==='BNRPRD'?'#a78bfa':g.env==='EASPRD'?'#f472b6':'#60a5fa';
    const gid = 'grp_'+focusId.replace(/[^a-z0-9]/gi,'_')+'_'+gi;
    const rows = g.tasks.map(({t,dep,e})=>{
      const vtColor = e&&e.via_type==='lookup'?'#f5a623':e&&e.via_type==='source+lookup'?'#cc88ff':'#2dd4aa';
      const via = e ? `<div class="dvia">used as <b style="color:${vtColor}">${e.via_type||'source'}</b> · via ${e.via.slice(0,2).join(', ')}${e.via.length>2?' …':''}</div>` : '';
      return `<li class="ditem warn-item" onclick="selectNode('${t}')"><span style="font-size:7px;color:#884444;margin-right:4px;">+${dep}</span>${t}${via}</li>`;
    }).join('');
    return `<div class="schema-group">
      <div class="schema-hdr" onclick="toggleGrp('${gid}')">
        <div class="schema-hdr-l"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${dotColor}"></span>${schema}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="schema-cnt">${g.tasks.length} task${g.tasks.length!==1?'s':''}</span>
          <span class="schema-arrow" id="arr_${gid}">›</span>
        </div>
      </div>
      <div class="schema-body" id="body_${gid}"><ul class="dlist">${rows}</ul></div>
    </div>`;
  }).join('');
  container.innerHTML = html;
}

function toggleGrp(gid){
  const body=document.getElementById('body_'+gid);
  const arr=document.getElementById('arr_'+gid);
  if(!body||!arr) return;
  const open=body.classList.toggle('open');
  arr.classList.toggle('open',open);
}

function closePanel(){
  document.getElementById('panel').classList.add('closed');
  SEL=null;
}

// ── SEARCH ─────────────────────────────────────────────────────────────────
function initSearch(){
  const inp=document.getElementById('search');
  const sugg=document.getElementById('suggestions');
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(!q){sugg.style.display='none';return;}
    // Strip common prefixes for cleaner matching
    const clean = s => s;  // keep full names including prefixes
    const qc = q.toLowerCase();
    const filtered = ALL_NODES.filter(n=>
      (!FILTER_ENV||n.env===FILTER_ENV)&&
      (n.id.toLowerCase().includes(qc)||n.mapping.toLowerCase().includes(qc)||n.schema.toLowerCase().includes(qc))
    );
    // Sort: exact clean-name match first, then prefix match, then substring
    filtered.sort((a,b)=>{
      const ac=clean(a.id).toLowerCase(), bc=clean(b.id).toLowerCase();
      const ae=ac===qc, be=bc===qc;
      if(ae&&!be) return -1; if(be&&!ae) return 1;
      const ap=ac.startsWith(qc), bp=bc.startsWith(qc);
      if(ap&&!bp) return -1; if(bp&&!ap) return 1;
      return ac.localeCompare(bc);
    });
    const matches=filtered.slice(0,30);
    if(!matches.length){sugg.style.display='none';return;}
    sugg.innerHTML=matches.map(n=>{
      const col=n.tier==='root'?'var(--root)':n.tier==='stage'?'var(--stage)':'var(--leaf)';
      const ec=envColor(n.env);
      const label=clean(n.id);
      // Highlight the matching portion
      const re=new RegExp('('+qc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      const hi=label.replace(re,'<b style="color:var(--hi)">$1</b>');
      return `<div class="sug-item" onclick="pick('${n.id}')">
        <span style="color:${ec};font-size:8px;margin-right:4px;">[${n.env}]</span>${hi}
        <span class="sug-tier" style="background:${col}22;color:${col}">${n.tier}</span>
      </div>`;
    }).join('');
    sugg.style.display='block';
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))sugg.style.display='none';});
}

function pick(id){
  document.getElementById('search').value=id;
  document.getElementById('suggestions').style.display='none';
  MODE='impact';
  document.getElementById('btn-impact').classList.add('on');
  document.getElementById('btn-full').classList.remove('on');
  selectNode(id);
}

// ── ZOOM ───────────────────────────────────────────────────────────────────
function zIn() {svgEl.call(zoom.scaleBy,1.3);}
function zOut(){svgEl.call(zoom.scaleBy,.77);}
function zFit(){
  const w=document.getElementById('cv').clientWidth;
  const h=document.getElementById('cv').clientHeight;
  svgEl.call(zoom.transform,d3.zoomIdentity.translate(w/2,h/2).scale(.18));
}

// ── TOOLTIP ────────────────────────────────────────────────────────────────
const tipEl=document.getElementById('tip');
function showTip(ev,d){
  if(d.isCluster){
    tipEl.innerHTML=`
      <div class="tipname">${d.env!=='Warehouse'?d.env+' · ':''}${d.schema}</div>
      <div class="tiprow"><span style="color:var(--failed)">${d.count} tasks at risk</span></div>
      <div class="tiprow" style="color:var(--dim)">Click to expand · click again to collapse</div>`;
  } else {
    const dn=ALL_EDGES.filter(e=>e.source===d.id).length;
    const up=ALL_EDGES.filter(e=>e.target===d.id).length;
    const ds=downstream(d.id).size-1;
    tipEl.innerHTML=`
      <div class="tipname">${d.id}</div>
      ${d.mapping?`<div class="tiprow" style="color:var(--dim)">↳ <span style="color:var(--text)">${d.mapping}</span></div>`:''}
      <div class="tiprow">env <span style="color:${envColor(d.env)}">${d.env}</span> · schema <span>${d.schema}</span> · tier <span>${d.tier}</span></div>
      <div class="tiprow">upstream <span>${up}</span> · direct downstream <span>${dn}</span></div>
      ${ds>0?`<div class="tiprow" style="color:var(--failed)">⚠ total at risk <span>${ds}</span></div>`:''}
      ${d.targets?.length?`<div class="tiprow">writes → <span style="color:var(--root)">${d.targets.slice(0,2).join(', ')}${d.targets.length>2?' …':''}</span></div>`:''}`;
  }
  tipEl.classList.add('on');
  moveTip(ev);
}
function hideTip(){tipEl.classList.remove('on');}
function moveTip(ev){
  tipEl.style.left=Math.min(ev.clientX+14,window.innerWidth-300)+'px';
  tipEl.style.top=(ev.clientY-10)+'px';
}
document.getElementById('cv').addEventListener('mousemove',moveTip);
</script>
</body>
</html>
