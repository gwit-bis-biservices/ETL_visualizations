<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IDMC ETL Architecture</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
:root{
  --bg:#0b0f1c;--bg2:#0e1524;--bg3:#111d30;--bg4:#152238;
  --border:#1c2c44;--text:#b8ccec;--dim:#3d5878;--hi:#ddeeff;
  --failed:#ff4d4d;--leaf:#f5a623;--root:#2dd4aa;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:12px;display:flex;flex-direction:column;}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;}
.logo span{color:var(--hi);}
h1{font-size:13px;font-weight:600;color:var(--hi);}
.hstats{margin-left:auto;display:flex;gap:18px;}
.hstat{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
.hstat b{color:var(--hi);}

.toolbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
select,input[type=text]{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 8px;border-radius:3px;outline:none;}
input[type=text]{color:var(--hi);width:220px;}
input[type=text]:focus,select:focus{border-color:#4a9eff;}
.tlbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
.tsep{width:1px;height:18px;background:var(--border);margin:0 3px;}
.legend{display:flex;gap:14px;margin-left:auto;align-items:center;}
.li{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);}
.lb{width:26px;height:9px;border-radius:2px;}

.main{flex:1;overflow:hidden;display:flex;}

/* ── LEFT PANEL ── */
.left{width:270px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;}
.left::-webkit-scrollbar{width:3px;}
.left::-webkit-scrollbar-thumb{background:var(--border);}
.schema-hdr{padding:10px 10px 3px;font-family:'IBM Plex Mono',monospace;font-size:8px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border)22;}

/* tree rows */
.tr{display:flex;align-items:center;cursor:pointer;border-left:2px solid transparent;transition:background .1s;}
.tr:hover{background:var(--bg3);}
.tr.sel{background:var(--bg4);}
.tr-tog{width:16px;display:flex;align-items:center;justify-content:center;font-size:9px;
  color:var(--dim);flex-shrink:0;padding:5px 0;transition:transform .15s;}
.tr-tog.open{transform:rotate(90deg);}
.tr-icon{font-size:10px;width:16px;text-align:center;flex-shrink:0;}
.tr-lbl{font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;padding:5px 3px;}
.tr-cnt{font-family:'IBM Plex Mono',monospace;font-size:8px;padding:1px 5px;border-radius:2px;flex-shrink:0;margin-right:6px;}
.tr-kids{display:none;}
.tr-kids.open{display:block;}

/* ── RIGHT CANVAS ── */
.right{flex:1;overflow:auto;}
.right::-webkit-scrollbar{width:6px;height:6px;}
.right::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
#canvas{display:block;}

.tip{position:fixed;background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  padding:9px 13px;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.9;
  pointer-events:none;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:340px;}
.tip.on{display:block;}
.tipn{font-size:11px;font-weight:600;color:var(--hi);margin-bottom:3px;}
.tipr{color:var(--dim);}
.tipr span{color:var(--text);}

#loading{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:12px;
  color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:11px;}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:#4a9eff;
  border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <div class="logo">IDMC · <span>ETL Architecture</span></div>
  <h1>Taskflow → Sub-Worklet → MCT → Mapping</h1>
  <div class="hstats" id="hstats"><div class="hstat">Loading…</div></div>
</header>
<div class="toolbar">
  <span class="tlbl">Project</span>
  <select id="sel-proj" onchange="refreshSchemas();applyFilters()"><option value="">All</option></select>
  <span class="tlbl">Schema</span>
  <select id="sel-schema" onchange="applyFilters()"><option value="">All Schemas</option></select>
  <div class="tsep"></div>
  <input type="text" id="search" placeholder="Search taskflow / task / mapping…" oninput="applyFilters()">
  <div class="legend">
    <div class="li"><div class="lb" style="background:#4a9eff33;border:1px solid #4a9eff80"></div>Root TF</div>
    <div class="li"><div class="lb" style="background:#f5a62333;border:1px solid #f5a62380"></div>Worklet</div>
    <div class="li"><div class="lb" style="background:#a78bfa33;border:1px solid #a78bfa80"></div>MCT</div>
    <div class="li"><div class="lb" style="background:#2dd4aa22;border:1px solid #2dd4aa80"></div>Mapping</div>
  </div>
</div>
<div class="main" id="main">
  <div id="loading"><div class="spin"></div><span>Loading data…</span></div>
</div>
<div class="tip" id="tip"></div>

function boot(){
  // Assign accent color per schema, grouped by project family
  const byProj={};
  TF_TREE.forEach(e=>{
    if(!byProj[e.project])byProj[e.project]=[];
    const k=e.project+'||'+e.schema;
    if(!schemaColorMap[k])byProj[e.project].push(k);
  });
  Object.entries(byProj).forEach(([proj,keys])=>{
    const palette=proj.includes('BNRPRD')?SCHEMA_COLORS_BNR:
                  proj.includes('EASPRD')?SCHEMA_COLORS_EAS:SCHEMA_COLORS_WH;
    keys.forEach((k,i)=>schemaColorMap[k]=palette[i%palette.length]);
  });

  populateFilters();
  renderStats();
  applyFilters();

  document.getElementById('loading').remove();
  document.getElementById('main').innerHTML=
    '<div class="left" id="left"></div><div class="right" id="right"><canvas id="canvas"></canvas></div>';

  renderLeft();
  renderCanvas();

  document.getElementById('right').addEventListener('mousemove',onMM);
  document.getElementById('right').addEventListener('click',onClick);
  document.addEventListener('mousemove',e=>{if(tipEl.classList.contains('on'))moveTip(e);});
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
function populateFilters(){
  const projs=[...new Set(TF_TREE.map(e=>e.project))].sort();
  const sp=document.getElementById('sel-proj');
  projs.forEach(p=>sp.add(new Option(p.replace('GW_Data_','').replace(/_/g,' '),p)));
  refreshSchemas();
}

function refreshSchemas(){
  PROJ_F=document.getElementById('sel-proj').value;
  const ss=document.getElementById('sel-schema');
  const prev=ss.value;
  ss.innerHTML='<option value="">All Schemas</option>';
  [...new Set(TF_TREE.filter(e=>!PROJ_F||e.project===PROJ_F).map(e=>e.schema))].sort()
    .forEach(s=>ss.add(new Option(s,s)));
  if([...ss.options].some(o=>o.value===prev)) ss.value=prev;
}

function applyFilters(){
  PROJ_F  =document.getElementById('sel-proj').value;
  SCHEMA_F=document.getElementById('sel-schema').value;
  Q       =document.getElementById('search').value.trim().toLowerCase();
  FILTERED=TF_TREE.filter(e=>{
    if(PROJ_F   &&e.project!==PROJ_F)   return false;
    if(SCHEMA_F &&e.schema !==SCHEMA_F) return false;
    if(Q&&!nodeMatchesQ(e.root))        return false;
    return true;
  });
  // Reset selection if no longer visible
  if(SEL_ENTRY&&!FILTERED.includes(SEL_ENTRY)){SEL_ENTRY=null;SEL_NODE_NAME=null;}
  const lp=document.getElementById('left');
  const rp=document.getElementById('right');
  if(lp)renderLeft();
  if(rp)renderCanvas();
}

function nodeMatchesQ(n){
  if(!n)return false;
  if(n.name.toLowerCase().includes(Q))return true;
  if(n.mapping&&n.mapping.toLowerCase().includes(Q))return true;
  return(n.children||[]).some(nodeMatchesQ);
}

function renderStats(){
  const projs=new Set(TF_TREE.map(e=>e.project)).size;
  const schs =new Set(TF_TREE.map(e=>e.schema)).size;
  const tasks=TF_TREE.reduce((s,e)=>s+countTasks(e.root),0);
  document.getElementById('hstats').innerHTML=`
    <div class="hstat"><b>${projs}</b> projects</div>
    <div class="hstat"><b>${schs}</b> schemas</div>
    <div class="hstat"><b>${TF_TREE.length}</b> root taskflows</div>
    <div class="hstat"><b>${tasks}</b> tasks</div>`;
}

function countTasks(n){
  if(!n)return 0;
  if(n.type==='task')return 1;
  return(n.children||[]).reduce((s,c)=>s+countTasks(c),0);
}

// ── LEFT TREE ─────────────────────────────────────────────────────────────────
// Track open/closed state per node
const OPEN_NODES=new Set();   // node names that are open
let leftInitDone=false;

function renderLeft(){
  const el=document.getElementById('left');
  if(!el)return;
  let html='', lastSchema='';

  // On first render, open all root nodes
  if(!leftInitDone){
    FILTERED.forEach(e=>{OPEN_NODES.add(e.root.name); /* open root by default */});
    leftInitDone=true;
  }

  FILTERED.forEach(entry=>{
    const {project,schema,root}=entry;
    const ck=project+'||'+schema;
    const c=schemaColorMap[ck]||'#4a9eff';
    if(schema+project!==lastSchema){
      lastSchema=schema+project;
      const pl=project.replace('GW_Data_','').replace(/_/g,' ');
      html+=`<div class="schema-hdr" style="color:${c}bb;padding-left:10px">${schema} <span style="color:var(--dim);font-weight:300">· ${pl}</span></div>`;
    }
    html+=buildTreeHTML(root,c,8,entry);
  });

  if(!html)html=`<div style="padding:20px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)">No results</div>`;
  el.innerHTML=html;
}

function buildTreeHTML(node,c,indent,entry){
  if(!node)return'';
  const isTask=node.type==='task';
  const isSel=node.name===SEL_NODE_NAME;
  const isOpen=OPEN_NODES.has(node.name);
  const hasKids=!isTask&&(node.children||[]).length>0;
  const cnt=countTasks(node);
  const selBorder=isSel?c:'transparent';

  const wc=node.wf_type==='wkl_'?COLOR_WORKLET:COLOR_ROOT_TF;
  const mc=isTask?COLOR_MCT:wc;
  const tc=isTask?(node.tier==='root'?'var(--root)':node.tier==='leaf'?'var(--leaf)':COLOR_MCT):wc;
  const icon=isTask?'⚙':(node.wf_type==='wkl_'?'◫':'⬡');
  const lbl=node.name.replace(/-1$/,'');

  const nid='n_'+node.name.replace(/[^a-z0-9]/gi,'_');
  const kid='k_'+node.name.replace(/[^a-z0-9]/gi,'_');
  const entryIdx=FILTERED.indexOf(entry);

  let h=`<div class="tr${isSel?' sel':''}" style="padding-left:${indent}px;border-left-color:${selBorder}"
    id="${nid}" onclick="leftClick('${node.name.replace(/'/g,"\\'")}',${entryIdx},this)">
    <span class="tr-tog${isTask?' leaf':''}${isOpen?' open':''}" id="tog_${kid}">${hasKids?'›':''}</span>
    <span class="tr-icon" style="color:${tc}">${icon}</span>
    <span class="tr-lbl" style="color:${tc};font-size:10px${!isTask?';font-weight:600':''}">${lbl}</span>
    ${!isTask&&hasKids?`<span class="tr-cnt" style="background:${wc}18;color:${wc}99">${cnt}</span>`:''}
    ${isTask&&(node.target_tables||[]).length?`<span class="tr-cnt" style="background:rgba(45,212,170,.08);color:var(--root);font-size:8px;max-width:90px;overflow:hidden;text-overflow:ellipsis" title="${(node.target_tables||[]).join(', ')}">${node.target_tables[0]}${node.target_tables.length>1?'+':''}
    </span>`:''}
    ${isTask&&(node.downstream||0)>0?`<span class="tr-cnt" style="background:rgba(255,77,77,.1);color:var(--failed)">▼${node.downstream}</span>`:''}
  </div>`;

  if(hasKids){
    h+=`<div class="tr-kids${isOpen?' open':''}" id="${kid}">`;
    (node.children||[]).forEach(ch=>{h+=buildTreeHTML(ch,c,indent+14,entry);});
    h+=`</div>`;
  }
  return h;
}

function leftClick(nodeName, entryIdx, el){
  const entry=FILTERED[entryIdx];
  SEL_NODE_NAME=nodeName===SEL_NODE_NAME?null:nodeName;
  SEL_ENTRY=SEL_NODE_NAME?entry:null;

  // Toggle open/closed
  if(!SEL_NODE_NAME||OPEN_NODES.has(nodeName)){
    if(OPEN_NODES.has(nodeName))OPEN_NODES.delete(nodeName);
    else OPEN_NODES.add(nodeName);
  } else {
    OPEN_NODES.add(nodeName);
  }

  renderLeft();
  renderCanvas();
}

// ── CANVAS ────────────────────────────────────────────────────────────────────
const ROW_H=22, PAD_T=16, PAD_B=20, GAP_TF=24;
const MIN_COL_W=220, CONN_W=44, TGT_LH=12;   // MIN_COL_W = narrowest MCT/mapping box — see fitColumns()
let CANVAS_W=0;   // set on every render: the right edge of the widest taskflow in view

// LAYOUT: flat array of drawable items built from tree
let LAYOUT=[];

function renderCanvas(){
  const canvas=document.getElementById('canvas');
  if(!canvas)return;

  // Decide what to render
  const toRender = SEL_ENTRY ? [SEL_ENTRY] : FILTERED;
  fitColumns(canvas.getContext('2d'),toRender);

  LAYOUT=[];
  let y=PAD_T;

  toRender.forEach(entry=>{
    const ck=entry.project+'||'+entry.schema;
    const c=schemaColorMap[ck]||'#4a9eff';
    const h=collectLayout(entry.root,c,0,y,entry);
    y+=h+GAP_TF;
  });

  const totalH=Math.max(y+PAD_B,300);
  CANVAS_W=toRender.reduce((m,e)=>Math.max(m,e.right),300);
  canvas.width=CANVAS_W;
  canvas.height=totalH;
  canvas.style.width=CANVAS_W+'px';
  canvas.style.height=totalH+'px';

  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,CANVAS_W,totalH);
  drawAll(ctx);
}

// Per-taskflow geometry: everything is sized to its text, so the tree stays narrow and nothing is cut off.
//   entry.cx[d]  x of column d
//   entry.cw[d]  width of the taskflow/worklet boxes in column d (their longest name)
//   entry.kw[d]  width of the MCT and mapping boxes of tasks in column d (their longest name, at least 220)
//   entry.tw     width of the target-table column (longest table name)
//   entry.right  right edge of the taskflow's widest row
function fitColumns(ctx,entries){
  const adv=f=>{ctx.font=f;return ctx.measureText('0').width;};   // monospace: one advance per font
  const aTF=adv(`600 10px 'IBM Plex Mono',monospace`), aNm=adv(`10px 'IBM Plex Mono',monospace`), aTg=adv(`9px 'IBM Plex Mono',monospace`);
  entries.forEach(e=>{
    const cw=[], kw=[]; let tw=40;
    const walk=(n,d)=>{
      if(!n)return;
      cw[d]=cw[d]||0;
      if(n.type==='task'){
        kw[d]=Math.ceil(Math.max(kw[d]||MIN_COL_W,Math.max(n.name.length,(n.mapping||'').length)*aNm+50));   // +50 = text inset + MCT/MAP tag
        (n.target_tables||[]).forEach(t=>{tw=Math.max(tw,Math.ceil((t.length+2)*aTg)+20);});
      } else {
        cw[d]=Math.ceil(Math.max(cw[d],60,n.name.replace(/-1$/,'').length*aTF+20));
        (n.children||[]).forEach(c=>walk(c,d+1));
      }
    };
    walk(e.root,0);
    e.cw=cw; e.kw=kw; e.tw=tw; e.cx=[]; e.right=0;
    let x=8;
    cw.forEach((w,d)=>{
      e.cx[d]=x;
      e.right=Math.max(e.right,x+w+8,kw[d]?x+2*kw[d]+CONN_W+tw+150:0);   // +150 = downstream dots + tier badge
      x+=w+CONN_W;
    });
  });
}

// Returns height consumed; populates LAYOUT
function collectLayout(node, color, depth, y0, entry){
  if(!node)return 0;

  const x=entry.cx[depth];

  if(node.type==='task'){
    const cy=y0+ROW_H/2;
    LAYOUT.push({kind:'task',node,color,depth,x,cy,y:y0,entry});
    return Math.max(ROW_H,(node.target_tables||[]).length*TGT_LH+10);
  }

  // Taskflow / worklet
  const children=node.children||[];
  if(!children.length){
    // Leaf TF with no tasks — still draw it
    const cy=y0+ROW_H/2;
    LAYOUT.push({kind:'tf',node,color,depth,x,cy,y:y0,h:ROW_H,childItems:[],entry});
    return ROW_H;
  }

  // Layout children first
  let childY=y0;
  const childItems=[];
  children.forEach(ch=>{
    const startIdx=LAYOUT.length;
    const h=collectLayout(ch,color,depth+1,childY,entry);
    const newItems=LAYOUT.slice(startIdx);
    childItems.push(...newItems);
    childY+=h;
  });

  const totalH=childY-y0;
  const cy=y0+totalH/2;
  LAYOUT.push({kind:'tf',node,color,depth,x,cy,y:y0,h:totalH,childItems,entry});
  return totalH;
}

function drawAll(ctx){
  // Draw connections first (behind nodes)
  LAYOUT.filter(r=>r.kind==='tf').forEach(tf=>{
    const rightX=tf.x+tf.entry.cw[tf.depth];
    // Direct children: items at depth+1 whose y is within tf's range
    const directChildren=LAYOUT.filter(ch=>{
      if(ch.entry!==tf.entry)return false;
      if(ch.depth!==tf.depth+1)return false;
      const chCY=ch.kind==='task'?ch.cy:ch.cy;
      return chCY>=tf.y-1&&chCY<=tf.y+tf.h+1;
    });
    directChildren.forEach(ch=>{
      const chX=ch.x;
      const chCY=ch.cy;
      drawBez(ctx,rightX,tf.cy,chX,chCY,tf.color);
    });
  });

  // MCT → Mapping connectors
  LAYOUT.filter(r=>r.kind==='task').forEach(r=>{
    const COL_W=r.entry.kw[r.depth];
    const mapX=r.x+COL_W+CONN_W;
    ctx.beginPath();ctx.moveTo(r.x+COL_W,r.cy);ctx.lineTo(mapX,r.cy);
    ctx.strokeStyle=r.color+'66';ctx.lineWidth=1.2;ctx.stroke();
    dot(ctx,r.x+COL_W,r.cy,3,r.color+'cc');
    dot(ctx,mapX,r.cy,3,r.color+'cc');
  });

  // Draw nodes on top
  LAYOUT.forEach(r=>{
    if(r.kind==='tf') drawTFBox(ctx,r);
    else              drawTaskRow(ctx,r);
  });
}

function drawTFBox(ctx,r){
  const COL_W=r.entry.cw[r.depth];
  const isSub=r.node.wf_type==='wkl_';
  const nc=isSub?COLOR_WORKLET:COLOR_ROOT_TF;  // orange for worklets, blue for root
  drawBox(ctx,r.x,r.cy-11,COL_W,22,4,nc+'22',nc+'80');
  dot(ctx,r.x+COL_W,r.cy,3.5,nc);
  ctx.fillStyle=nc;ctx.font=`600 10px 'IBM Plex Mono',monospace`;ctx.textAlign='left';
  ctx.fillText(r.node.name.replace(/-1$/,''),r.x+8,r.cy+4);
  const tag=isSub?'WORKLET':'TASKFLOW';
  ctx.fillStyle=nc+'88';ctx.font=`8px 'IBM Plex Mono',monospace`;
  ctx.fillText(tag,r.x+8,r.cy+14);
}

function drawTaskRow(ctx,r){
  const COL_W=r.entry.kw[r.depth];
  const mapX=r.x+COL_W+CONN_W;
  const mapW=COL_W;
  // MCT box — always purple
  drawBox(ctx,r.x,r.cy-9,COL_W,18,3,COLOR_MCT+'20',COLOR_MCT+'66');
  ctx.fillStyle=COLOR_MCT+'ee';ctx.font=`10px 'IBM Plex Mono',monospace`;ctx.textAlign='left';
  ctx.fillText(r.node.name,r.x+7,r.cy+4);
  tagBox(ctx,'MCT',r.x+COL_W-36,r.cy-6,COLOR_MCT);
  // Mapping box — always teal
  const ml=r.node.mapping||r.node.name;
  drawBox(ctx,mapX,r.cy-9,mapW,18,3,COLOR_MAP+'18',COLOR_MAP+'55');
  ctx.fillStyle=COLOR_MAP+'cc';ctx.font=`10px 'IBM Plex Mono',monospace`;ctx.textAlign='left';
  ctx.fillText(ml,mapX+7,r.cy+4);
  tagBox(ctx,'MAP',mapX+mapW-36,r.cy-6,COLOR_MAP);
  // Target table label — shown between mapping box and dots
  const tgts=(r.node.target_tables||[]);
  if(tgts.length){
    ctx.fillStyle=COLOR_MAP+'99';
    ctx.font=`9px 'IBM Plex Mono',monospace`;
    tgts.forEach((t,i)=>ctx.fillText((i?'  ':'→ ')+t,mapX+mapW+10,r.cy+3+i*TGT_LH));
  }
  // Downstream dots
  let dx=mapX+mapW+14+r.entry.tw;
  const dn=Math.min(r.node.downstream||0,5);
  if(dn>0){ctx.fillStyle=r.color+'44';ctx.font=`9px 'IBM Plex Mono',monospace`;ctx.fillText('▶',dx-12,r.cy+3);}
  for(let d=0;d<dn;d++){
    ctx.beginPath();ctx.arc(dx,r.cy,3.5,0,Math.PI*2);
    ctx.fillStyle=r.color;ctx.globalAlpha=.75-d*.12;ctx.fill();ctx.globalAlpha=1;dx+=11;
  }
  if((r.node.downstream||0)>5){ctx.fillStyle=r.color+'66';ctx.font=`8px 'IBM Plex Mono',monospace`;ctx.fillText('+'+(r.node.downstream-5),dx+2,r.cy+3);}
  // Tier badge
  if(r.node.tier==='root'||r.node.tier==='leaf'){
    const bc=r.node.tier==='root'?'#2dd4aa':'#f5a623';
    drawBox(ctx,r.entry.right-44,r.cy-6,36,12,2,bc+'18',bc+'33');
    ctx.fillStyle=bc+'cc';ctx.font=`8px 'IBM Plex Mono',monospace`;ctx.textAlign='center';
    ctx.fillText(r.node.tier,r.entry.right-26,r.cy+4);ctx.textAlign='left';
  }
}

function tagBox(ctx,label,x,y,color){
  drawBox(ctx,x,y,34,12,2,color+'18',color+'2a');
  ctx.fillStyle=color+'88';ctx.font=`8px 'IBM Plex Mono',monospace`;ctx.textAlign='center';
  ctx.fillText(label,x+17,y+9);ctx.textAlign='left';
}

function drawBez(ctx,x0,y0,x1,y1,color){
  const cp=x0+Math.max(30,Math.abs(x1-x0)*.55);
  ctx.beginPath();ctx.moveTo(x0,y0);
  ctx.bezierCurveTo(cp,y0,cp,y1,x1,y1);
  ctx.strokeStyle=color+'88';ctx.lineWidth=1.5;ctx.stroke();
  dot(ctx,x0,y0,3,color);dot(ctx,x1,y1,3,color);
}

function drawBox(ctx,x,y,w,h,r,fill,stroke){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function dot(ctx,x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}

// ── HIT TEST & TOOLTIP ────────────────────────────────────────────────────────
const tipEl=document.getElementById('tip');

function hitTest(x,y){
  // Check task rows (MCT + mapping area)
  for(let i=LAYOUT.length-1;i>=0;i--){
    const r=LAYOUT[i];
    const COL_W=(r.kind==='task'?r.entry.kw:r.entry.cw)[r.depth];
    const cy=r.cy;
    if(Math.abs(y-cy)>ROW_H/2)continue;
    if(r.kind==='task'&&x>=r.x&&x<=r.x+COL_W+CONN_W+COL_W)return r;
    if(r.kind==='tf'&&x>=r.x&&x<=r.x+COL_W)return r;
  }
  return null;
}

function onMM(ev){
  const rect=ev.currentTarget.getBoundingClientRect();
  const x=ev.clientX-rect.left+ev.currentTarget.scrollLeft;
  const y=ev.clientY-rect.top +ev.currentTarget.scrollTop;
  const hit=hitTest(x,y);
  if(hit){
    ev.currentTarget.style.cursor='pointer';
    const n=hit.node;
    if(hit.kind==='task'){
      tipEl.innerHTML=`
        <div class="tipn">${n.name}</div>
        <div class="tipr">mapping <span>${n.mapping||''}</span></div>
        <div class="tipr">tier    <span>${n.tier||'?'}</span></div>
        ${(n.target_tables||[]).length?`<div class="tipr">table(s) <span style="color:var(--root)">${n.target_tables.slice(0,3).join(', ')}${n.target_tables.length>3?'…':''}</span></div>`:''}
        ${(n.targets||[]).length?`<div class="tipr">full path <span style="font-size:9px">${n.targets[0]}</span></div>`:''}
        ${(n.sources||[]).length?`<div class="tipr">reads  ← <span>${n.sources.slice(0,3).join(', ')}${n.sources.length>3?'…':''}</span></div>`:''}
        <div class="tipr">downstream <span style="color:var(--failed)">${n.downstream||0}</span>  upstream <span style="color:var(--root)">${n.upstream||0}</span></div>`;
    } else {
      tipEl.innerHTML=`
        <div class="tipn">${n.name.replace(/-1$/,'')}</div>
        <div class="tipr">type  <span>${n.wf_type==='wkl_'?'Sub-Worklet':'Root Taskflow'}</span></div>
        <div class="tipr">tasks <span>${countTasks(n)}</span></div>`;
    }
    tipEl.classList.add('on');moveTip(ev);
  } else {
    tipEl.classList.remove('on');
    ev.currentTarget.style.cursor='default';
  }
}

function onClick(ev){
  const rect=ev.currentTarget.getBoundingClientRect();
  const x=ev.clientX-rect.left+ev.currentTarget.scrollLeft;
  const y=ev.clientY-rect.top +ev.currentTarget.scrollTop;
  const hit=hitTest(x,y);
  if(hit){
    const n=hit.node;
    SEL_NODE_NAME=n.name===SEL_NODE_NAME?null:n.name;
    SEL_ENTRY=SEL_NODE_NAME?hit.entry:null;
    renderLeft();
    renderCanvas();
  }
}

function moveTip(ev){
  tipEl.style.left=Math.min(ev.clientX+16,window.innerWidth-360)+'px';
  tipEl.style.top=(ev.clientY-10)+'px';
}
</script>
